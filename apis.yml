aid: orbii-tech-ltd
name: Orbii Tech Ltd
description: >-
  Orbii is a MENA-region credit and lending infrastructure company. Its API turns raw business
  financial data - bank transactions and invoices - into automated underwriting signals: derived
  KPIs, borrower risk assessment, credit band classification, and suggested loan amounts. Fintech
  lenders, neobanks, and merchant platforms (Foodics, Rewaa) integrate a single API to launch and
  scale SME lending products such as salary advance, merchant financing, working capital, embedded
  lending, and BNPL, with regional deployments for Saudi Arabia (KSA) and Oman (OMN). Orbii raised
  a $3.6M seed round backed by Prosus, VentureSouq, Dash Ventures, and Sanabil 500.
