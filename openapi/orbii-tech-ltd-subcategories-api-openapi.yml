openapi: 3.0.0
info:
  title: Orbii API - Foodics Business Category Assignment Subcategories API
  version: 1.0.2
  description: API for retrieving micro loan KPIs, scoring, risk assessment, band classification, and related data.
servers:
- url: https://api.foodics.orbii.ai/
  description: Production Server
tags:
- name: Subcategories
paths:
  /subcategories/{clientname}:
    get:
      summary: Get distinct subcategories for a client
      description: Fetches distinct subcategories for a given client.
      tags:
      - Subcategories
      parameters:
      - name: clientname
        in: path
        required: true
        schema:
          type: string
      - name: user
        in: query
        schema:
          type: string
      - name: password
        in: query
        schema:
          type: string
      responses:
        '200':
          description: A list of distinct subcategories for the client.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
